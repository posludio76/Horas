<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis Horas">
<title>Mis Horas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f3f4f7;--card:#fff;--tx:#14161a;--mu:#6b7280;--ac:#0a7a5a;--ac2:#e8f5f0;--bd:#e3e5ea;--dn:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1113;--card:#1a1d21;--tx:#f0f1f3;--mu:#9aa0a8;--ac:#3ecf9f;--ac2:#14312a;--bd:#2a2e34;--dn:#ff6b5b}}
:root[data-theme="dark"]{--bg:#0f1113;--card:#1a1d21;--tx:#f0f1f3;--mu:#9aa0a8;--ac:#3ecf9f;--ac2:#14312a;--bd:#2a2e34;--dn:#ff6b5b}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px}
main{max-width:560px;margin:0 auto;display:grid;gap:14px}
h1{font-size:22px;margin:4px 0 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
label{display:block;font-size:12px;color:var(--mu);margin:0 0 4px}
input,select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 14px;background:var(--ac);color:#fff;width:100%;margin-top:10px}
button.sec{background:var(--ac2);color:var(--ac)}
.big{font-size:34px;font-weight:700;letter-spacing:-.5px}
.mu{color:var(--mu);font-size:13px}
.line{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd)}
.line:last-child{border:0}
.tot{font-weight:700;font-size:18px;color:var(--ac)}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}
.item .d{flex:1;min-width:0}.item .n{color:var(--mu);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .x{width:auto;margin:0;padding:6px 10px;background:transparent;color:var(--dn);font-size:20px}
summary{font-weight:600;cursor:pointer}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--ac2);color:var(--ac);font-weight:600}
</style>
</head>
<body>
<main>
<h1>Mis Horas</h1>

<div class="card">
  <label for="mes">Mes</label>
  <input id="mes" type="month">
  <div style="margin-top:12px"><span class="mu">Horas del mes</span><div class="big" id="tH">0</div>
  <div id="badge" class="mu"></div></div>
</div>

<div class="card">
  <b>Mis valores</b>
  <div class="row3">
    <div><label for="rate">Valor de la hora normal</label><input id="rate" type="text" inputmode="decimal" placeholder="Ej: 10"></div>
    <div><label for="extra">Valor extra (al pasar el límite)</label><input id="extra" type="text" inputmode="decimal" placeholder="Ej: 15"></div>
    <div><label for="limit">Horas límite del mes</label><input id="limit" type="text" inputmode="decimal"></div>
    <div><label for="mode">El extra se paga</label><select id="mode"><option value="hora">Por cada hora extra</option><option value="fijo">Monto fijo al pasar el límite</option></select></div>
    <div><label for="sym">Moneda</label><input id="sym" type="text" maxlength="4"></div>
    <div><label for="nombre">Tu nombre (para el PDF)</label><input id="nombre" type="text"></div>
  </div>
</div>

<div class="card">
  <div class="row"><div><label for="fecha">Fecha</label><input id="fecha" type="date"></div>
  <div><label for="hs">Horas (7,5 o 7:30)</label><input id="hs" type="text" inputmode="decimal" placeholder="8"></div></div>
  <div class="row3"><div style="grid-column:1/3"><label for="nota">Nota (opcional)</label><input id="nota" type="text" placeholder="Ej: turno tarde"></div></div>
  <button id="add">Agregar horas</button>
</div>

<div class="card">
  <div class="line"><span>Horas normales</span><b id="hN">0</b></div>
  <div class="line"><span>Horas extra (sobre el límite)</span><b id="hE">0</b></div>
  <div class="line"><span>Pago horas normales</span><b id="pN">0</b></div>
  <div class="line"><span>Pago extras</span><b id="pE">0</b></div>
  <div class="line"><span>Total a cobrar</span><span class="tot" id="pT">0</span></div>
  <button id="pdf">Crear PDF del mes</button>
</div>


<div class="card">
  <b>Horas cargadas</b>
  <div id="list"></div>
</div>
<p class="mu" style="text-align:center">Los datos se guardan solo en este dispositivo.</p>
</main>

<script>
const $=id=>document.getElementById(id);
let S={name:'',rate:0,extra:0,limit:160,mode:'hora',sym:'$'},E=[];
try{const s=JSON.parse(localStorage.getItem('horas_v1')||'null');if(s){S=Object.assign(S,s.S);E=s.E||[]}}catch(e){}
function persist(){try{localStorage.setItem('horas_v1',JSON.stringify({S,E}))}catch(e){}}
const num=v=>{v=String(v).trim();if(v.includes(':')){const[a,b]=v.split(':');return (parseFloat(a)||0)+(parseFloat(b)||0)/60}
  const n=parseFloat(v.replace(',','.'));return isNaN(n)?0:n};
const f2=n=>n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
const fh=n=>n.toLocaleString('es-ES',{maximumFractionDigits:2});
const money=n=>S.sym+' '+f2(n);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
$('mes').value=today().slice(0,7);$('fecha').value=today();
$('nombre').value=S.name;$('rate').value=S.rate||'';$('limit').value=S.limit;$('extra').value=S.extra||'';$('mode').value=S.mode;$('sym').value=S.sym;

function calc(){
  const m=$('mes').value,list=E.filter(e=>e.d.startsWith(m));
  const total=list.reduce((a,e)=>a+e.h,0),reg=Math.min(total,S.limit),ext=Math.max(0,total-S.limit);
  const pN=reg*S.rate,pE=S.mode==='hora'?ext*S.extra:(ext>0?S.extra:0);
  return{m,list,total,reg,ext,pN,pE,pT:pN+pE};
}
function render(){
  const c=calc();
  $('tH').textContent=fh(c.total)+' h';
  $('badge').innerHTML=c.ext>0?'<span class="badge">Superaste las '+fh(S.limit)+' h · +'+fh(c.ext)+' h extra</span>':'Te faltan '+fh(Math.max(0,S.limit-c.total))+' h para el límite de '+fh(S.limit);
  $('hN').textContent=fh(c.reg)+' h';$('hE').textContent=fh(c.ext)+' h';
  $('pN').textContent=money(c.pN);$('pE').textContent=money(c.pE);$('pT').textContent=money(c.pT);
  const L=$('list');L.textContent='';
  if(!c.list.length){L.innerHTML='<p class="mu">Todavía no cargaste horas en este mes.</p>';return}
  c.list.sort((a,b)=>b.d.localeCompare(a.d)).forEach(e=>{
    const r=document.createElement('div');r.className='item';
    const d=document.createElement('div');d.className='d';
    const [y,mo,da]=e.d.split('-');
    d.innerHTML='<div><b></b> <span class="mu"></span></div><div class="n"></div>';
    d.querySelector('b').textContent=fh(e.h)+' h';
    d.querySelector('.mu').textContent=da+'/'+mo+'/'+y;
    d.querySelector('.n').textContent=e.n||'';
    const x=document.createElement('button');x.className='x';x.textContent='×';x.setAttribute('aria-label','Borrar');
    x.onclick=()=>{E=E.filter(z=>z.id!==e.id);persist();render()};
    r.append(d,x);L.append(r);
  });
}
$('add').onclick=()=>{
  const h=num($('hs').value);
  if(!($('fecha').value)||h<=0||h>24){alert('Ingresá una fecha y una cantidad de horas válida (entre 0 y 24).');return}
  E.push({id:Date.now()+Math.random(),d:$('fecha').value,h,n:$('nota').value.trim()});
  $('hs').value='';$('nota').value='';
  $('mes').value=$('fecha').value.slice(0,7);
  persist();render();
};
$('mes').onchange=render;
['nombre','rate','limit','extra','mode','sym'].forEach(id=>$(id).addEventListener('input',()=>{
  S.name=$('nombre').value;S.rate=num($('rate').value);S.limit=num($('limit').value)||160;
  S.extra=num($('extra').value);S.mode=$('mode').value;S.sym=$('sym').value||'$';persist();render();
}));

$('pdf').onclick=async()=>{
  const c=calc();
  if(!window.jspdf){alert('No se pudo cargar el generador de PDF. Revisá tu conexión.');return}
  const doc=new window.jspdf.jsPDF({unit:'pt',format:'a4'});
  const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();
  const [y,mo]=c.m.split('-');
  const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  let yy=56;
  doc.setFont('helvetica','bold');doc.setFontSize(20);doc.text('Estado de horas trabajadas',40,yy);yy+=22;
  doc.setFont('helvetica','normal');doc.setFontSize(12);
  doc.text((meses[+mo-1]||'')+' de '+y+(S.name?'  ·  '+S.name:''),40,yy);yy+=26;
  doc.setDrawColor(200);doc.line(40,yy,W-40,yy);yy+=20;
  doc.setFont('helvetica','bold');doc.text('Fecha',40,yy);doc.text('Horas',130,yy);doc.text('Nota',200,yy);yy+=8;doc.line(40,yy,W-40,yy);yy+=16;
  doc.setFont('helvetica','normal');
  const sorted=c.list.slice().sort((a,b)=>a.d.localeCompare(b.d));
  sorted.forEach(e=>{
    if(yy>H-90){doc.addPage();yy=56}
    const p=e.d.split('-');
    doc.text(p[2]+'/'+p[1]+'/'+p[0],40,yy);doc.text(fh(e.h),130,yy);
    doc.text(doc.splitTextToSize(e.n||'',W-240)[0]||'',200,yy);yy+=18;
  });
  if(!sorted.length){doc.text('Sin horas cargadas en este mes.',40,yy);yy+=18}
  if(yy>H-200){doc.addPage();yy=56}
  yy+=10;doc.line(40,yy,W-40,yy);yy+=24;
  const row=(a,b,bold)=>{doc.setFont('helvetica',bold?'bold':'normal');doc.text(a,40,yy);doc.text(b,W-40,yy,{align:'right'});yy+=20};
  row('Total de horas del mes',fh(c.total)+' h',true);
  row('Límite mensual',fh(S.limit)+' h');
  row('Horas normales',fh(c.reg)+' h');
  row('Horas extra',fh(c.ext)+' h');
  yy+=6;
  row('Valor por hora',money(S.rate));
  row(S.mode==='hora'?'Valor por hora extra':'Monto fijo por superar el límite',money(S.extra));
  yy+=6;
  row('Pago por horas normales',money(c.pN));
  row('Pago por extras',money(c.pE));
  doc.setFontSize(14);yy+=4;row('TOTAL A COBRAR',money(c.pT),true);
  const name='horas-'+c.m+'.pdf';
  try{
    const dl=(typeof claude!=='undefined'&&claude.use)?await claude.use('downloads'):null;
    if(dl){await dl.save({filename:name,data:doc.output('arraybuffer')})}else{doc.save(name)}
  }catch(e){if(!e||e.code!=='declined')alert('No se pudo guardar el PDF.')}
};
render();
</script>
</body>
</html>
